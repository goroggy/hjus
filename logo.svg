<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HJus">
  <title>HJus</title>
  <rect width="64" height="64" rx="12" fill="#1B2028"/>
  <g fill="none" stroke="#F2F2EE" stroke-width="3.6" stroke-linecap="round">
    <!-- three rings of a labyrinth, each opening on a different side -->
    <path d="M37.81 8.71 A24 24 0 1 1 26.19 8.71"/>
    <path d="M26.75 48.17 A17 17 0 1 1 37.25 48.17"/>
    <path d="M41.27 35.75 A10 10 0 1 1 41.27 28.25"/>
    <!-- walls between the rings -->
    <path d="M8 32 H15"/>
    <path d="M32 15 V22"/>
    <path d="M49 32 H56"/>
  </g>
  <circle cx="32" cy="32" r="3.6" fill="#E4908C"/>
</svg>
